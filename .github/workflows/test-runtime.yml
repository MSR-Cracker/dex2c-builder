name: Test Native Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/**"
      - ".github/workflows/test-runtime.yml"

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "ndk;${NDK_VERSION}"

          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Build Native Runtime
        shell: bash
        run: |
          set -euxo pipefail

          cd runtime/jni

          "$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT="$PWD/Android.mk" \
            NDK_APPLICATION_MK="$PWD/Application.mk" \
            V=1

      - name: Verify Libraries
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Generated libraries"
          echo "========================================"

          find runtime/jni/libs \
            -type f \
            -name "*.so" \
            -print \
            -exec file {} \;

          echo
          echo "ABI check:"

          for ABI in \
            arm64-v8a \
            armeabi-v7a \
            x86 \
            x86_64
          do
            LIB="runtime/jni/libs/$ABI/libnative_library.so"

            if [ -f "$LIB" ]; then
              echo "OK: $ABI"
            else
              echo "::error::Missing library for $ABI"
              exit 1
            fi
          done

      - name: Upload Native Runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime
          path: runtime/jni/libs/
          if-no-files-found: error
