name: Dex2C APK Obfuscator

on:
  push:
    paths:
      - 'input/*.apk'
  workflow_dispatch:

jobs:
  protect-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool python3-pip git

      - name: Setup Dex2C Tool
        run: |
          git clone https://github.com/amimo/dcc.git dex2c_tool
          cd dex2c_tool
          pip3 install -r requirements.txt || pip3 install -r requirements.txt --break-system-packages

      - name: Run Dex2C Conversion
        run: |
          mkdir -p output
          INPUT_APK=$(ls input/*.apk | head -n 1)
          if [ -z "$INPUT_APK" ]; then
            echo "No APK found in input/ directory!"
            exit 1
          fi

          echo "Input APK: $INPUT_APK"
          
          # تشغيل DCC واستخراج الناتج لمجلد مؤقت
          cd dex2c_tool
          
          # إعداد dcc.cfg بمسار NDK والمحلل النظامي
          cat <<EOF > dcc.cfg
          {
              "apktool": "/usr/bin/apktool",
              "ndk_dir": "$ANDROID_NDK_LATEST_HOME"
          }
          EOF

          python3 dcc.py "../$INPUT_APK" -o "../output/protected_unaligned.apk"

      - name: Sign & Verify APK
        run: |
          cd output
          ls -la
          
          if [ -f protected_unaligned.apk ]; then
            # 1. ZipAlign
            zipalign -v -p 4 protected_unaligned.apk protected_aligned.apk
            
            # 2. Key Generation
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            
            # 3. Signing
            apksigner sign --ks debug.keystore --ks-pass pass:android --out final_protected.apk protected_aligned.apk
            echo "Done! Final APK created."
          else
            echo "Error: DCC did not generate protected_unaligned.apk"
            exit 1
          fi

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: output/final_protected.apk
