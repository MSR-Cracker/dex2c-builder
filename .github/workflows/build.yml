name: MSR Dex2C Builder

on:
  workflow_dispatch:
  push:
    paths:
      - "input/*.apk"
      - "filter.txt"
      - "runtime/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NDK_VERSION: "29.0.14206865"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Install SDK + NDK
      # ============================================================
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"

          test -d "$NDK"
          test -f "$NDK/ndk-build"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=$NDK"

      # ============================================================
      # 5. Locate APK
      # ============================================================
      - name: Locate Input APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          APK_COUNT=$(find input \
            -maxdepth 1 \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK found in input/"
            exit 1
          fi

          if [ "$APK_COUNT" -gt 1 ]; then
            echo "::warning::More than one APK found. Using the first one."
          fi

          INPUT_APK=$(find input \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | sort \
            | head -n 1)

          echo "INPUT_APK=$INPUT_APK" >> "$GITHUB_ENV"

          echo "Input APK:"
          ls -lh "$INPUT_APK"

      # ============================================================
      # 6. Build MSR Native Runtime
      # ============================================================
      - name: Build MSR Native Runtime
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"

          cd runtime/jni

          echo "========================================"
          echo "BUILDING MSR NATIVE RUNTIME"
          echo "========================================"

          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT="$PWD/Android.mk" \
            APP_ABI="arm64-v8a armeabi-v7a x86 x86_64" \
            V=1

          echo
          echo "========================================"
          echo "GENERATED MSR LIBRARIES"
          echo "========================================"

          find libs -type f -name "*.so" -print

          test -s libs/arm64-v8a/libmsr.so
          test -s libs/armeabi-v7a/libmsr.so
          test -s libs/x86/libmsr.so
          test -s libs/x86_64/libmsr.so

          echo
          echo "MSR runtime build: OK"

      # ============================================================
      # 7. Verify MSR Libraries
      # ============================================================
      - name: Verify MSR Runtime
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING MSR RUNTIME"
          echo "========================================"

          for ABI in \
            arm64-v8a \
            armeabi-v7a \
            x86 \
            x86_64
          do
            LIB="runtime/jni/libs/$ABI/libmsr.so"

            echo
            echo "ABI: $ABI"
            ls -lh "$LIB"
            file "$LIB"

            test -s "$LIB"
          done

          echo
          echo "All MSR libraries verified."

      # ============================================================
      # 8. Clone Dex2Cxx
      # ============================================================
      - name: Clone Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dex2cxx_tool

          git clone \
            --depth 1 \
            https://github.com/ispointer/Dex2cxx.git \
            dex2cxx_tool

          cd dex2cxx_tool

          echo "Dex2Cxx commit:"
          git rev-parse HEAD

      # ============================================================
      # 9. Configure Dex2Cxx
      # ============================================================
      - name: Configure Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"

          cat > dxx.cfg <<EOF
          {
              "apktool": "tools/apktool.jar",
              "ndk_dir": "$NDK",
              "signature": {
                  "keystore_path": "keystore/debug.keystore",
                  "alias": "androiddebugkey",
                  "keystore_pass": "android",
                  "store_pass": "android",
                  "v1_enabled": true,
                  "v2_enabled": true,
                  "v3_enabled": true
              },
              "ollvm": {
                  "enable": false,
                  "flags": "-fvisibility=hidden"
              }
          }
          EOF

          echo "===== dxx.cfg ====="
          cat dxx.cfg

      # ============================================================
      # 10. Prepare Filter
      # ============================================================
      - name: Prepare Filter
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          if [ -s ../filter.txt ]; then
            cp ../filter.txt ./filter.txt
          else
            printf '%s\n' 'com.test1.MainActivity' > filter.txt
          fi

          echo "===== filter.txt ====="
          cat filter.txt

      # ============================================================
      # 11. Build Dex2Cxx JAR
      # ============================================================
      - name: Build Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          chmod +x java/build.sh

          ./java/build.sh

          test -s dex2cxx.jar

          echo "Dex2Cxx JAR:"
          ls -lh dex2cxx.jar

      # ============================================================
      # 12. Verify Dex2Cxx CLI
      # ============================================================
      - name: Verify Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          java -jar dex2cxx.jar --help

      # ============================================================
      # 13. Scan APK
      # ============================================================
      - name: Scan APK
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          rm -f methods-report.txt

          java -jar dex2cxx.jar \
            -a "../$INPUT_APK" \
            --filter ./filter.txt \
            --report ./methods-report.txt \
            --list-only

          echo
          echo "========================================"
          echo "MATCHED METHODS"
          echo "========================================"

          cat methods-report.txt

          MATCHED=$(wc -l < methods-report.txt)

          echo
          echo "Matched methods: $MATCHED"

          if [ "$MATCHED" -eq 0 ]; then
            echo "::error::No methods matched filter.txt"
            exit 1
          fi

      # ============================================================
      # 14. Run Dex2Cxx
      # ============================================================
      - name: Run Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          rm -f protected.apk

          echo "========================================"
          echo "RUNNING DEX2CXX"
          echo "========================================"

          java -jar dex2cxx.jar \
            -a "../$INPUT_APK" \
            -o protected.apk \
            --filter ./filter.txt \
            --report ./methods-report.txt

          test -s protected.apk

          echo
          echo "Generated APK:"
          ls -lh protected.apk

      # ============================================================
      # 15. Validate APK
      # ============================================================
      - name: Validate Protected APK
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          unzip -t protected.apk >/dev/null

          echo "APK ZIP structure: OK"

      # ============================================================
      # 16. Analyze Dex2Cxx Output
      # ============================================================
      - name: Analyze Dex2Cxx Output
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          echo
          echo "========================================"
          echo "DEX FILES"
          echo "========================================"

          unzip -Z1 protected.apk \
            | grep -E '^classes[0-9]*\.dex$' \
            | sort -V \
            || true

          echo
          echo "========================================"
          echo "NATIVE LIBRARIES FROM DEX2CXX"
          echo "========================================"

          unzip -Z1 protected.apk \
            | grep '^lib/.*/.*\.so$' \
            | sort \
            || true

          echo
          echo "========================================"
          echo "METHOD REPORT"
          echo "========================================"

          cat methods-report.txt

      # ============================================================
      # 17. Prepare Final Output
      # ============================================================
      - name: Prepare Final Output
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          cp dex2cxx_tool/protected.apk \
            output/final_protected.apk

          cp dex2cxx_tool/methods-report.txt \
            output/methods-report.txt

          cp runtime/jni/libs/arm64-v8a/libmsr.so \
            output/libmsr-arm64-v8a.so

          cp runtime/jni/libs/armeabi-v7a/libmsr.so \
            output/libmsr-armeabi-v7a.so

          cp runtime/jni/libs/x86/libmsr.so \
            output/libmsr-x86.so

          cp runtime/jni/libs/x86_64/libmsr.so \
            output/libmsr-x86_64.so

          echo
          echo "========================================"
          echo "FINAL OUTPUT"
          echo "========================================"

          ls -lh output/

      # ============================================================
      # 18. Upload
      # ============================================================
      - name: Upload MSR Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MSR-protected-build
          path: |
            output/final_protected.apk
            output/methods-report.txt
            output/libmsr-arm64-v8a.so
            output/libmsr-armeabi-v7a.so
            output/libmsr-x86.so
            output/libmsr-x86_64.so
          if-no-files-found: error
