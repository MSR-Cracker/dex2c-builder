name: Dex2C APK Obfuscator

on:
  push:
    paths:
      - 'input/*.apk'
  workflow_dispatch:

jobs:
  protect-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool python3-pip git

      - name: Setup dProtect (Modern Dex2C)
        run: |
          git clone https://github.com/dProtect/dProtect.git dprotect_tool
          cd dprotect_tool
          pip3 install -r requirements.txt || pip3 install . --break-system-packages

      - name: Process APK with dProtect
        run: |
          mkdir -p output
          INPUT_APK=$(ls input/*.apk | head -n 1)
          if [ -z "$INPUT_APK" ]; then
            echo "No APK found in input/ directory!"
            exit 1
          fi

          echo "Processing $INPUT_APK with dProtect..."
          cd dprotect_tool
          
          # تشغيل التشفير وتحويل الـ DEX إلى C++
          python3 dprotect.py "../$INPUT_APK" -o "../output/protected_unsigned.apk" --ndk $ANDROID_NDK_LATEST_HOME

      - name: Align and Sign Output APK
        run: |
          if [ -f output/protected_unsigned.apk ]; then
            echo "Signing APK..."
            zipalign -v -p 4 output/protected_unsigned.apk output/protected_aligned.apk
            
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            
            apksigner sign --ks debug.keystore --ks-pass pass:android --out output/protected_signed.apk output/protected_aligned.apk
            echo "Protected and Signed APK is Ready!"
          else
            echo "Error: Output APK was not created by dProtect."
            exit 1
          fi

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: output/protected_signed.apk
