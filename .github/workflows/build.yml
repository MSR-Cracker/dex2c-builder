name: Dex2C APK Obfuscator

on:
  push:
    paths:
      - 'input/*.apk'
  workflow_dispatch:

jobs:
  protect-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool python3-pip wget git

      - name: Setup Dex2C Tool (amimo/dcc)
        run: |
          git clone https://github.com/amimo/dcc.git dex2c_tool
          cd dex2c_tool
          
          mkdir -p tools
          wget -q -O tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          
          pip3 install -r requirements.txt || pip3 install -r requirements.txt --break-system-packages

      - name: Process and Convert MainActivity Only
        run: |
          mkdir -p output
          INPUT_APK=$(ls input/*.apk | head -n 1)
          if [ -z "$INPUT_APK" ]; then
            echo "No APK found in input/ directory!"
            exit 1
          fi

          echo "Processing $INPUT_APK with filter for MainActivity..."
          cd dex2c_tool

          cat <<EOF > dcc.cfg
          {
              "apktool": "tools/apktool.jar",
              "ndk_dir": "$ANDROID_NDK_LATEST_HOME"
          }
          EOF

          # تشغيل التشفير مع تحديد الكلاس المباشر لمنع الأخطاء
          python3 dcc.py "../$INPUT_APK" --filter "com/test1/MainActivity" -o "../output/protected_unaligned.apk"

      - name: Align and Sign Output APK
        run: |
          if [ -f output/protected_unaligned.apk ]; then
            echo "Aligning and signing APK..."
            zipalign -v -p 4 output/protected_unaligned.apk output/protected_aligned.apk
            
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            
            apksigner sign --ks debug.keystore --ks-pass pass:android --out output/protected_signed.apk output/protected_aligned.apk
            echo "Done! Protected and Signed APK created successfully."
          else
            echo "Error: Output APK was not generated!"
            exit 1
          fi

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: output/protected_signed.apk
