name: Dex2C APK Obfuscator

on:
  push:
    paths:
      - 'input/*.apk'
  workflow_dispatch:

jobs:
  protect-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool python3-pip wget git

      - name: Setup Dex2C (ispointer/Dex2C)
        run: |
          git clone https://github.com/ispointer/Dex2C.git dex2c_tool
          cd dex2c_tool
          
          # تثبيت المتطلبات
          pip3 install -r requirements.txt || pip3 install -r requirements.txt --break-system-packages

      - name: Run Dex2C Obfuscation
        run: |
          mkdir -p output
          INPUT_APK=$(ls input/*.apk | head -n 1)
          if [ -z "$INPUT_APK" ]; then
            echo "No APK found in input/ directory!"
            exit 1
          fi

          echo "Processing $INPUT_APK with ispointer/Dex2C..."
          cd dex2c_tool
          
          # تشغيل السكربت بحسب مسارات الـ NDK والـ APK
          python3 main.py -i "../$INPUT_APK" -o "../output/protected_unaligned.apk" --ndk $ANDROID_NDK_LATEST_HOME

      - name: Align and Sign Output APK
        run: |
          if [ -f output/protected_unaligned.apk ]; then
            echo "Aligning and signing output APK..."
            zipalign -v -p 4 output/protected_unaligned.apk output/protected_aligned.apk
            
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            
            apksigner sign --ks debug.keystore --ks-pass pass:android --out output/protected_signed.apk output/protected_aligned.apk
            echo "Success! Protected APK created."
          else
            echo "Error: Output APK was not generated!"
            exit 1
          fi

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: output/protected_signed.apk
