name: MSR Dex2C Builder

on:
  workflow_dispatch:
  push:
    paths:
      - "input/*.apk"
      - "filter.txt"
      - "runtime/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NDK_VERSION: "29.0.14206865"
      LIB_NAME: "msr"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Install SDK / NDK
      # ============================================================
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"

          echo "NDK=$NDK"

          test -d "$NDK"
          test -f "$NDK/ndk-build"

          echo "NDK installed successfully"

      # ============================================================
      # 5. Locate APK
      # ============================================================
      - name: Locate Input APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          APK_COUNT=$(find input \
            -maxdepth 1 \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK found in input/"
            exit 1
          fi

          INPUT_APK=$(find input \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | sort \
            | head -n 1)

          echo "INPUT_APK=$INPUT_APK" >> "$GITHUB_ENV"

          echo "Input APK:"
          ls -lh "$INPUT_APK"

      # ============================================================
      # 6. Clone Dex2Cxx
      # ============================================================
      - name: Clone Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dex2cxx_tool

          git clone \
            --depth 1 \
            https://github.com/ispointer/Dex2cxx.git \
            dex2cxx_tool

          cd dex2cxx_tool

          echo "Dex2Cxx commit:"
          git rev-parse HEAD

      # ============================================================
      # 7. Configure Dex2Cxx
      # ============================================================
      - name: Configure Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"

          cat > dxx.cfg <<EOF
          {
              "apktool": "tools/apktool.jar",
              "ndk_dir": "$NDK",
              "signature": {
                  "keystore_path": "keystore/debug.keystore",
                  "alias": "androiddebugkey",
                  "keystore_pass": "android",
                  "store_pass": "android",
                  "v1_enabled": true,
                  "v2_enabled": true,
                  "v3_enabled": true
              },
              "ollvm": {
                  "enable": false,
                  "flags": "-fvisibility=hidden"
              }
          }
          EOF

          cat dxx.cfg

      # ============================================================
      # 8. Prepare filter
      # ============================================================
      - name: Prepare Filter
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          if [ -f ../filter.txt ]; then
            cp ../filter.txt ./filter.txt
          else
            printf '%s\n' 'com.test1.MainActivity' > filter.txt
          fi

          echo "===== FILTER ====="
          cat filter.txt

      # ============================================================
      # 9. Build Dex2Cxx JAR
      # ============================================================
      - name: Build Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          chmod +x java/build.sh

          ./java/build.sh

          test -s dex2cxx.jar

          echo "Dex2Cxx built:"
          ls -lh dex2cxx.jar

      # ============================================================
      # 10. Verify CLI
      # ============================================================
      - name: Verify Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          java -jar dex2cxx.jar --help

      # ============================================================
      # 11. Verify NDK
      # ============================================================
      - name: Verify NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"

          echo "NDK:"
          ls -ld "$NDK"

          echo "ndk-build:"
          ls -l "$NDK/ndk-build"

          "$NDK/ndk-build" --version

      # ============================================================
      # 12. Scan APK
      # ============================================================
      - name: Scan APK
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          rm -f methods-report.txt

          java -jar dex2cxx.jar \
            -a "../$INPUT_APK" \
            --filter ./filter.txt \
            --report ./methods-report.txt \
            --list-only

          echo
          echo "========================================"
          echo "MATCHED METHODS"
          echo "========================================"

          cat methods-report.txt

          MATCHED=$(wc -l < methods-report.txt)

          echo
          echo "Matched methods: $MATCHED"

          if [ "$MATCHED" -eq 0 ]; then
            echo "::error::No methods matched filter.txt"
            exit 1
          fi

      # ============================================================
      # 13. Run Dex2Cxx
      # ============================================================
      - name: Run Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          rm -f protected.apk

          echo "========================================"
          echo "RUNNING DEX2CXX"
          echo "========================================"

          java -jar dex2cxx.jar \
            -a "../$INPUT_APK" \
            -o protected.apk \
            --filter ./filter.txt \
            --report ./methods-report.txt

          test -s protected.apk

          echo
          echo "Generated APK:"
          ls -lh protected.apk

      # ============================================================
      # 14. Validate APK
      # ============================================================
      - name: Validate Protected APK
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          unzip -t protected.apk >/dev/null

          echo "APK ZIP structure: OK"

      # ============================================================
      # 15. Analyze output
      # ============================================================
      - name: Analyze Output
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          echo
          echo "========================================"
          echo "OUTPUT DEX FILES"
          echo "========================================"

          unzip -l protected.apk \
            | awk '{print $4}' \
            | grep -E '^classes[0-9]*\.dex$' \
            | sort -u || true

          echo
          echo "========================================"
          echo "OUTPUT NATIVE LIBRARIES"
          echo "========================================"

          unzip -l protected.apk \
            | awk '{print $4}' \
            | grep '^lib/.*/.*\.so$' \
            | sort -u || true

          echo
          echo "========================================"
          echo "METHOD REPORT"
          echo "========================================"

          cat methods-report.txt

      # ============================================================
      # 16. Prepare final artifact
      # ============================================================
      - name: Prepare Final Output
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          cp dex2cxx_tool/protected.apk \
             output/final_protected.apk

          cp dex2cxx_tool/methods-report.txt \
             output/methods-report.txt

          test -s output/final_protected.apk

          echo "========================================"
          echo "FINAL OUTPUT"
          echo "========================================"

          ls -lh output/

      # ============================================================
      # 17. Upload
      # ============================================================
      - name: Upload Protected APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MSR-protected-apk
          path: |
            output/final_protected.apk
            output/methods-report.txt
          if-no-files-found: error
