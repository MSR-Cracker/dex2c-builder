name: Dex2C APK Obfuscator

on:
  push:
    paths:
      - 'input/*.apk'
  workflow_dispatch:

jobs:
  protect-apk:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool python3-pip wget git build-essential

      - name: Setup Dex2C Engine
        run: |
          git clone https://github.com/amimo/dcc.git dex2c_tool
          cd dex2c_tool
          pip3 install androguard pyelftools python-magic --break-system-packages || pip3 install androguard pyelftools python-magic

      - name: Execute Dex2C Engine Steps
        run: |
          mkdir -p output
          INPUT_APK=$(ls input/*.apk | head -n 1)
          if [ -z "$INPUT_APK" ]; then
            echo "No APK found in input/ directory!"
            exit 1
          fi

          echo "Found APK: $INPUT_APK"
          cd dex2c_tool
          
          # 1. إعداد ملف التكوين
          cat <<EOF > dcc.cfg
          {
              "apktool": "/usr/bin/apktool",
              "ndk_dir": "$ANDROID_NDK_LATEST_HOME"
          }
          EOF

          # 2. إنشاء ملف الفلتر بصيغة Regex دقيقة لتحديد الكلاس
          echo "com/test1/MainActivity" > filter.txt

          # 3. تشغيل الأداة بحجم الـ parameters المعتمد فقط
          python3 dcc.py "../$INPUT_APK" --filter filter.txt -o "../output/protected_unaligned.apk"

      - name: Verify Output and Alignment
        run: |
          cd output
          if [ -f protected_unaligned.apk ]; then
            echo "Success: APK generated!"
            zipalign -v -p 4 protected_unaligned.apk final_protected.apk || cp protected_unaligned.apk final_protected.apk
          else
            echo "Error: Conversion failed!"
            exit 1
          fi

      - name: Upload Protected APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: output/final_protected.apk
