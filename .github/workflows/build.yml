name: Dex2Cxx APK Obfuscator

on:
  workflow_dispatch:
  push:
    paths:
      - "input/*.apk"
      - "filter.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  protect-apk:
    runs-on: ubuntu-latest

    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DEX2CXX_DIR: dex2cxx_tool
      NDK_VERSION: "29.0.14206865"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Android SDK + NDK
      # ============================================================
      - name: Install Android SDK / NDK
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          echo
          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo
          echo "Installed NDK:"
          ls -la "$ANDROID_HOME/ndk/${NDK_VERSION}"

      # ============================================================
      # 5. Locate APK
      # ============================================================
      - name: Locate Input APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          APK_COUNT=$(find input \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK found in input/"
            exit 1
          fi

          if [ "$APK_COUNT" -gt 1 ]; then
            echo "::warning::More than one APK found. Using the first one."
          fi

          INPUT_APK=$(find input \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | sort \
            | head -n 1)

          echo "INPUT_APK=$INPUT_APK" >> "$GITHUB_ENV"

          echo
          echo "Selected APK:"
          ls -lh "$INPUT_APK"

          echo
          echo "File information:"
          file "$INPUT_APK"

      # ============================================================
      # 6. Clone Dex2Cxx
      # ============================================================
      - name: Setup Dex2Cxx
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$DEX2CXX_DIR"

          git clone \
            --depth 1 \
            https://github.com/ispointer/Dex2cxx.git \
            "$DEX2CXX_DIR"

          cd "$DEX2CXX_DIR"

          echo
          echo "Dex2Cxx commit:"
          git rev-parse HEAD

          echo
          echo "Repository files:"
          find . \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100

      # ============================================================
      # 7. Configure Dex2Cxx
      # ============================================================
      - name: Configure Dex2Cxx
        shell: bash
        run: |
          set -euxo pipefail

          cd "$DEX2CXX_DIR"

          cat > dxx.cfg <<EOF
          {
              "apktool": "tools/apktool.jar",
              "ndk_dir": "$ANDROID_HOME/ndk/$NDK_VERSION",
              "signature": {
                  "keystore_path": "keystore/debug.keystore",
                  "alias": "androiddebugkey",
                  "keystore_pass": "android",
                  "store_pass": "android",
                  "v1_enabled": true,
                  "v2_enabled": true,
                  "v3_enabled": true
              },
              "ollvm": {
                  "enable": false,
                  "flags": "-fvisibility=hidden"
              }
          }
          EOF

          echo
          echo "===== dxx.cfg ====="
          cat dxx.cfg

      # ============================================================
      # 8. Prepare filter
      # ============================================================
      - name: Prepare Class Filter
        shell: bash
        run: |
          set -euxo pipefail

          cd "$DEX2CXX_DIR"

          if [ -f ../filter.txt ]; then
            cp ../filter.txt ./filter.txt
          else
            cat > filter.txt <<'EOF'
          com.test1.MainActivity
          EOF
          fi

          echo
          echo "===== filter.txt ====="
          cat filter.txt

      # ============================================================
      # 9. Build Dex2Cxx JAR
      # ============================================================
      - name: Build Dex2Cxx JAR
        shell: bash
        run: |
          set -euxo pipefail

          cd "$DEX2CXX_DIR"

          chmod +x java/build.sh

          ./java/build.sh

          if [ ! -f dex2cxx.jar ]; then
            echo "::error::dex2cxx.jar was not generated."
            exit 1
          fi

          echo
          echo "===== Dex2Cxx JAR ====="
          ls -lh dex2cxx.jar

      # ============================================================
      # 10. Verify CLI
      # ============================================================
      - name: Verify Dex2Cxx
        shell: bash
        run: |
          set -euxo pipefail

          cd "$DEX2CXX_DIR"

          java -jar dex2cxx.jar --help

      # ============================================================
      # 11. Scan APK / Generate Method Report
      # ============================================================
      - name: Scan APK / Generate Method Report
        shell: bash
        run: |
          set -euo pipefail

          cd "$DEX2CXX_DIR"

          rm -f methods-report.txt

          java -jar dex2cxx.jar \
            -a "../$INPUT_APK" \
            --filter ./filter.txt \
            --report ./methods-report.txt \
            --list-only

          echo
          echo "========================================"
          echo "Matching methods"
          echo "========================================"

          if [ -f methods-report.txt ]; then
            cat methods-report.txt
          fi

          MATCHED=$(wc -l < methods-report.txt 2>/dev/null || echo 0)

          echo
          echo "Matched methods: $MATCHED"

          if [ "$MATCHED" -eq 0 ]; then
            echo "::error::No methods matched the filter."
            echo "::error::Check filter.txt and the package/class name."
            exit 1
          fi

      # ============================================================
      # 12. Run Dex2Cxx
      # ============================================================
      - name: Run Dex2Cxx Conversion
        shell: bash
        run: |
          set -euxo pipefail

          cd "$DEX2CXX_DIR"

          rm -f protected.apk

          echo "========================================"
          echo "Starting Dex2Cxx"
          echo "========================================"

          echo "Input APK:"
          echo "../$INPUT_APK"

          echo
          echo "Filter:"
          cat filter.txt

          echo

          java -jar dex2cxx.jar \
            -a "../$INPUT_APK" \
            -o protected.apk \
            --filter ./filter.txt \
            --report ./methods-report.txt

          if [ ! -f protected.apk ]; then
            echo "::error::protected.apk was not generated."
            exit 1
          fi

          if [ ! -s protected.apk ]; then
            echo "::error::protected.apk is empty."
            exit 1
          fi

          echo
          echo "===== Generated APK ====="
          ls -lh protected.apk

          echo
          file protected.apk

      # ============================================================
      # 13. Validate APK + Native Libraries
      # ============================================================
      - name: Validate Protected APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$DEX2CXX_DIR"

          echo
          echo "========================================"
          echo "APK validation"
          echo "========================================"

          if [ ! -s protected.apk ]; then
            echo "::error::Protected APK does not exist."
            exit 1
          fi

          # --------------------------------------------------------
          # ZIP validation
          # --------------------------------------------------------

          echo
          echo "[1] Testing ZIP structure..."

          unzip -t protected.apk >/dev/null

          echo "ZIP: OK"

          # --------------------------------------------------------
          # DEX files
          # --------------------------------------------------------

          echo
          echo "[2] DEX files:"

          unzip -Z1 protected.apk \
            | grep -E '^classes([0-9]*)?\.dex$' \
            || true

          # --------------------------------------------------------
          # Native libraries
          # --------------------------------------------------------

          echo
          echo "[3] Native libraries:"

          unzip -l protected.apk \
            | grep -E 'lib/.+\.so$' \
            || true

          echo
          echo "[4] Complete native library list:"

          unzip -Z1 protected.apk \
            | grep '^lib/.*/.*\.so$' \
            || true

          # --------------------------------------------------------
          # ABI verification
          # --------------------------------------------------------

          echo
          echo "[5] Checking expected ABIs..."

          FOUND=0

          for ABI in \
            arm64-v8a \
            armeabi-v7a \
            x86 \
            x86_64
          do

            if unzip -Z1 protected.apk \
              | grep -q "^lib/$ABI/.*\.so$"
            then
              echo "OK: $ABI"
              FOUND=$((FOUND + 1))
            else
              echo "WARNING: missing $ABI"
            fi

          done

          echo
          echo "ABIs containing native libraries: $FOUND/4"

          # --------------------------------------------------------
          # Do not silently accept an APK without native code
          # --------------------------------------------------------

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No native .so files were found inside the protected APK."
            exit 1
          fi

          echo
          echo "APK validation completed successfully."

      # ============================================================
      # 14. Prepare Final Output
      # ============================================================
      - name: Prepare Final Output
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          cp \
            "$DEX2CXX_DIR/protected.apk" \
            output/final_protected.apk

          cp \
            "$DEX2CXX_DIR/methods-report.txt" \
            output/methods-report.txt

          echo
          echo "========================================"
          echo "Final output"
          echo "========================================"

          ls -lh output/

          echo
          echo "Final APK:"
          file output/final_protected.apk

          echo
          echo "DEX files inside final APK:"

          unzip -Z1 output/final_protected.apk \
            | grep -E '^classes([0-9]*)?\.dex$' \
            || true

          echo
          echo "Native libraries inside final APK:"

          unzip -Z1 output/final_protected.apk \
            | grep '^lib/.*/.*\.so$' \
            || true

      # ============================================================
      # 15. Final APK Integrity Check
      # ============================================================
      - name: Final APK Integrity Check
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking final APK..."

          test -s output/final_protected.apk

          unzip -t output/final_protected.apk >/dev/null

          echo "Final APK: VALID"

          echo
          echo "SHA256:"

          sha256sum output/final_protected.apk

      # ============================================================
      # 16. Upload Artifact
      # ============================================================
      - name: Upload Protected APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: |
            output/final_protected.apk
            output/methods-report.txt
          if-no-files-found: error
