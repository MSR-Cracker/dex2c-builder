name: Dex2C APK Obfuscator

on:
  push:
    paths:
      - 'input/*.apk'
  workflow_dispatch:

jobs:
  protect-apk:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool python3-pip wget git

      - name: Setup Dex2C Engine
        run: |
          git clone https://github.com/amimo/dcc.git dex2c_tool
          cd dex2c_tool
          pip3 install androguard pyelftools python-magic --break-system-packages || pip3 install androguard pyelftools python-magic

      - name: Run Full Dex2C Conversion
        run: |
          mkdir -p output
          INPUT_APK=$(ls input/*.apk | head -n 1)
          if [ -z "$INPUT_APK" ]; then
            echo "No APK found in input/ directory!"
            exit 1
          fi

          echo "Processing $INPUT_APK..."
          cd dex2c_tool
          
          cat <<EOF > dcc.cfg
          {
              "apktool": "/usr/bin/apktool",
              "ndk_dir": "$ANDROID_NDK_LATEST_HOME"
          }
          EOF

          # تشغيل التشفير على الـ APK بالكامل بدون الفلتر المعطل
          python3 dcc.py "../$INPUT_APK" -o "../output/protected_unaligned.apk"

      - name: Upload Output (Signed or Unsigned)
        run: |
          cd output
          if [ -f protected_unaligned.apk ]; then
            # محاولة توقيع سريعة، ولو فشلت هيعتمد الملف غير الموقع ويرفعه برضه عشان توقع بنفسك على MT Manager
            zipalign -v -p 4 protected_unaligned.apk protected_aligned.apk || cp protected_unaligned.apk protected_aligned.apk
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
            apksigner sign --ks debug.keystore --ks-pass pass:android --out final_protected.apk protected_aligned.apk || cp protected_aligned.apk final_protected.apk
            echo "Processing finished!"
          else
            echo "Error: Output APK was not generated!"
            exit 1
          fi

      - name: Upload Protected APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: output/final_protected.apk
