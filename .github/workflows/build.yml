name: Dex2C APK Obfuscator

on:
  push:
    paths:
      - 'input/*.apk'
  workflow_dispatch:

jobs:
  protect-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool
          pip install git+https://github.com/amursi/dCC.git || pip install dprotect

      - name: Process and Convert APK (Dex2C)
        run: |
          mkdir -p output
          INPUT_APK=$(ls input/*.apk | head -n 1)
          if [ -z "$INPUT_APK" ]; then
            echo "No APK found in input/ directory!"
            exit 1
          fi
          
          echo "Processing $INPUT_APK..."
          # تشغيل محرك Dex2C تحويل الـ Dex إلى C وتجميعه بالـ NDK المدمج
          dcc --input "$INPUT_APK" --out output/protected.apk --ndk $ANDROID_NDK_LATEST_HOME

      - name: Sign Output APK
        run: |
          # إنشاء مفتاح توقيع مؤقت لتوقيع التطبيق
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android output/protected.apk

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: output/protected.apk
