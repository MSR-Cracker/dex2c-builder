name: Dex2C APK Obfuscator

on:
  push:
    paths:
      - 'input/*.apk'
  workflow_dispatch:

jobs:
  protect-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner python3-pip wget git

      - name: Setup Dex2C Engine (Modern APKEditor Engine)
        run: |
          # استنساخ المحرك الحديث MSR/rufusin Dex2C
          git clone https://github.com/rufusin/Dex2C.git dex2c_tool
          cd dex2c_tool
          
          # تحميل APKEditor الحديثة لفك وتجميع الـ APK
          mkdir -p tools
          wget -O tools/apkeditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.2/APKEditor-1.4.2.jar
          
          # تثبيت المتطلبات
          pip3 install -r requirements.txt || pip3 install -r requirements.txt --break-system-packages

      - name: Process and Convert APK (Dex2C)
        run: |
          mkdir -p output
          INPUT_APK=$(ls input/*.apk | head -n 1)
          if [ -z "$INPUT_APK" ]; then
            echo "No APK found in input/ directory!"
            exit 1
          fi
          
          echo "Processing $INPUT_APK..."
          cd dex2c_tool
          
          # إعداد إعدادات المحرك مع NDK و APKEditor
          cat <<EOF > dcc.cfg
          {
              "apkeditor": "tools/apkeditor.jar",
              "ndk_dir": "$ANDROID_NDK_LATEST_HOME"
          }
          EOF
          
          # تشغيل التشفير وتحويل DEX إلى C++
          python3 dcc.py -a "../$INPUT_APK" -o "../output/protected_raw.apk"

      - name: Sign and Align Output APK
        run: |
          if [ -f output/protected_raw.apk ]; then
            echo "Aligning and signing output APK..."
            zipalign -v -p 4 output/protected_raw.apk output/protected_aligned.apk || cp output/protected_raw.apk output/protected_aligned.apk
            
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            apksigner sign --ks debug.keystore --ks-pass pass:android --out output/protected_final.apk output/protected_aligned.apk
            echo "APK Protected & Signed successfully!"
          else
            echo "Error: Failed to generate output APK!"
            exit 1
          fi

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: output/protected_final.apk
