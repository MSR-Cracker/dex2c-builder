name: Test Runtime APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runtime-apk:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "29.0.14206865"
      BUILD_TOOLS: "35.0.0"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Install Android SDK + NDK
      # ============================================================
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          echo "Android SDK ready."

          echo
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/${NDK_VERSION}"

      # ============================================================
      # 5. Verify Input APK
      # ============================================================
      - name: Check Input APK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s input/app.apk ]; then
            echo "::error::input/app.apk was not found."
            exit 1
          fi

          echo "Input APK:"
          ls -lh input/app.apk

          unzip -t input/app.apk >/dev/null

          echo "APK is valid."

      # ============================================================
      # 6. Build Native Runtime
      # ============================================================
      - name: Build Native Runtime
        shell: bash
        run: |
          set -euxo pipefail

          cd runtime/jni

          "$ANDROID_HOME/ndk/${NDK_VERSION}/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT="$PWD/Android.mk" \
            NDK_APPLICATION_MK="$PWD/Application.mk" \
            V=1

          echo
          echo "========================================"
          echo "Generated Native Libraries"
          echo "========================================"

          find libs \
            -type f \
            -name "*.so" \
            -print \
            -exec file {} \;

      # ============================================================
      # 7. Verify Native Runtime
      # ============================================================
      - name: Verify Native Runtime
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking native libraries..."

          for ABI in \
            arm64-v8a \
            armeabi-v7a \
            x86 \
            x86_64
          do

            LIB="runtime/jni/libs/$ABI/libnative_library.so"

            if [ ! -s "$LIB" ]; then
              echo "::error::Missing native library: $LIB"
              exit 1
            fi

            echo "OK: $ABI"

          done

          echo
          echo "All 4 native libraries are available."

      # ============================================================
      # 8. Prepare Runtime Java Sources
      # ============================================================
      - name: Prepare Runtime Java
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/runtime-src
          mkdir -p build/runtime-src/native_library0

          cp \
            runtime/java/native_library0/Loader.java \
            build/runtime-src/native_library0/Loader.java

          cat > build/runtime-src/native_library0/RuntimeTest.java <<'EOF'
          package native_library0;

          public final class RuntimeTest {

              private RuntimeTest() {
              }

              public static void test() {
                  Loader.registerNativesForClass(
                      0,
                      RuntimeTest.class
                  );
              }
          }
          EOF

          echo "Runtime Java files:"

          find build/runtime-src \
            -type f \
            -name "*.java" \
            -print

      # ============================================================
      # 9. Compile Runtime Java
      # ============================================================
      - name: Compile Runtime Java
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/runtime-classes
          mkdir -p build/runtime-classes

          javac \
            -source 8 \
            -target 8 \
            -d build/runtime-classes \
            build/runtime-src/native_library0/Loader.java \
            build/runtime-src/native_library0/RuntimeTest.java

          echo
          echo "Compiled class files:"

          find build/runtime-classes \
            -type f \
            -name "*.class" \
            -print

          CLASS_COUNT=$(find build/runtime-classes \
            -type f \
            -name "*.class" \
            | wc -l)

          if [ "$CLASS_COUNT" -eq 0 ]; then
            echo "::error::No .class files were generated."
            exit 1
          fi

          echo
          echo "Generated class count: $CLASS_COUNT"

      # ============================================================
      # 10. Create Runtime DEX
      # ============================================================
      - name: Create Runtime DEX
        shell: bash
        run: |
          set -euo pipefail

          D8="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/d8"

          if [ ! -x "$D8" ]; then
            echo "::error::D8 was not found."
            exit 1
          fi

          rm -rf build/runtime-dex
          mkdir -p build/runtime-dex

          echo "Input class files:"

          find build/runtime-classes \
            -type f \
            -name "*.class" \
            -print

          CLASS_COUNT=$(find build/runtime-classes \
            -type f \
            -name "*.class" \
            | wc -l)

          if [ "$CLASS_COUNT" -eq 0 ]; then
            echo "::error::No .class files available for D8."
            exit 1
          fi

          mapfile -t CLASS_FILES < <(
            find build/runtime-classes \
              -type f \
              -name "*.class" \
              -print
          )

          echo
          echo "Running D8..."

          "$D8" \
            --min-api 26 \
            --output build/runtime-dex \
            "${CLASS_FILES[@]}"

          if [ ! -s build/runtime-dex/classes.dex ]; then
            echo "::error::D8 did not generate classes.dex."
            exit 1
          fi

          mv \
            build/runtime-dex/classes.dex \
            build/runtime-dex/classes3.dex

          echo
          echo "Runtime DEX generated successfully:"

          ls -lh build/runtime-dex/classes3.dex

      # ============================================================
      # 11. Prepare Test APK
      # ============================================================
      - name: Prepare Test APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/apk
          mkdir -p build/apk

          echo "Extracting original APK..."

          unzip -q \
            input/app.apk \
            -d build/apk

          # --------------------------------------------------------
          # Add runtime DEX
          # --------------------------------------------------------

          cp \
            build/runtime-dex/classes3.dex \
            build/apk/classes3.dex

          # --------------------------------------------------------
          # Create ABI directories
          # --------------------------------------------------------

          mkdir -p \
            build/apk/lib/arm64-v8a \
            build/apk/lib/armeabi-v7a \
            build/apk/lib/x86 \
            build/apk/lib/x86_64

          # --------------------------------------------------------
          # Add native libraries
          # --------------------------------------------------------

          cp \
            runtime/jni/libs/arm64-v8a/libnative_library.so \
            build/apk/lib/arm64-v8a/

          cp \
            runtime/jni/libs/armeabi-v7a/libnative_library.so \
            build/apk/lib/armeabi-v7a/

          cp \
            runtime/jni/libs/x86/libnative_library.so \
            build/apk/lib/x86/

          cp \
            runtime/jni/libs/x86_64/libnative_library.so \
            build/apk/lib/x86_64/

          echo
          echo "Runtime injected into APK."

          echo
          echo "Runtime DEX:"
          ls -lh build/apk/classes3.dex

          echo
          echo "Native libraries:"

          find build/apk/lib \
            -type f \
            -name "*.so" \
            -exec ls -lh {} \;

      # ============================================================
      # 12. Build APK
      # ============================================================
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd build/apk

          zip -qr \
            ../runtime-test-unaligned.apk \
            .

          cd ../..

          unzip -t \
            build/runtime-test-unaligned.apk \
            >/dev/null

          echo "APK rebuilt successfully."

      # ============================================================
      # 13. Zipalign APK
      # ============================================================
      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "::error::zipalign was not found."
            exit 1
          fi

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            build/runtime-test-unaligned.apk \
            build/runtime-test.apk

          echo
          echo "Aligned APK:"
          ls -lh build/runtime-test.apk

      # ============================================================
      # 14. Verify Runtime APK
      # ============================================================
      - name: Verify Runtime APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/runtime-test.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Runtime APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "APK ZIP TEST"
          echo "========================================"

          unzip -t "$APK" >/dev/null

          echo "ZIP: OK"

          echo
          echo "========================================"
          echo "DEX FILES"
          echo "========================================"

          unzip -Z1 "$APK" \
            | grep -E '^classes([0-9]*)?\.dex$'

          echo
          echo "========================================"
          echo "NATIVE LIBRARIES"
          echo "========================================"

          unzip -Z1 "$APK" \
            | grep '^lib/.*/.*\.so$'

          echo
          echo "========================================"
          echo "RUNTIME DEX"
          echo "========================================"

          unzip -p \
            "$APK" \
            classes3.dex \
            > build/classes3.dex

          test -s build/classes3.dex

          ls -lh build/classes3.dex

          echo
          echo "========================================"
          echo "APK SUMMARY"
          echo "========================================"

          ls -lh "$APK"

      # ============================================================
      # 15. Upload Runtime Test APK
      # ============================================================
      - name: Upload Runtime Test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-apk
          path: |
            build/runtime-test.apk
            build/classes3.dex
          if-no-files-found: error
