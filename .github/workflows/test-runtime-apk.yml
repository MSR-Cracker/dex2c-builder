name: Test Runtime APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runtime-apk:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "29.0.14206865"
      BUILD_TOOLS: "35.0.0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;${BUILD_TOOLS}"

      - name: Check Input APK
        run: |
          set -euo pipefail

          test -s input/app.apk

          echo "Input APK:"
          ls -lh input/app.apk

          unzip -t input/app.apk >/dev/null

          echo "APK is valid."

      - name: Prepare Runtime Java
        run: |
          set -euo pipefail

          mkdir -p build/runtime-src

          cp runtime/java/native_library0/Loader.java \
             build/runtime-src/

          cat > build/runtime-src/RuntimeTest.java <<'EOF'
          package native_library0;

          public final class RuntimeTest {

              private RuntimeTest() {
              }

              public static void test() {
                  Loader.registerNativesForClass(
                      0,
                      RuntimeTest.class
                  );
              }
          }
          EOF

          echo "Runtime Java files:"
          find build/runtime-src -type f -print

      - name: Compile Runtime Java
        run: |
          set -euo pipefail

          mkdir -p build/runtime-classes

          javac \
            -source 8 \
            -target 8 \
            -d build/runtime-classes \
            build/runtime-src/Loader.java \
            build/runtime-src/RuntimeTest.java

          echo "Compiled classes:"
          find build/runtime-classes -type f -print

      - name: Create Runtime DEX
        run: |
          set -euo pipefail

          D8="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/d8"

          test -x "$D8"

          mkdir -p build/runtime-dex

          "$D8" \
            --min-api 26 \
            --output build/runtime-dex \
            build/runtime-classes/*.class

          test -s build/runtime-dex/classes.dex

          mv \
            build/runtime-dex/classes.dex \
            build/runtime-dex/classes3.dex

          echo "Runtime DEX:"
          ls -lh build/runtime-dex/classes3.dex

      - name: Prepare Test APK
        run: |
          set -euo pipefail

          rm -rf build/apk
          mkdir -p build/apk

          unzip -q input/app.apk -d build/apk

          cp \
            build/runtime-dex/classes3.dex \
            build/apk/classes3.dex

          mkdir -p \
            build/apk/lib/arm64-v8a \
            build/apk/lib/armeabi-v7a \
            build/apk/lib/x86 \
            build/apk/lib/x86_64

          cp \
            runtime/jni/libs/arm64-v8a/libnative_library.so \
            build/apk/lib/arm64-v8a/

          cp \
            runtime/jni/libs/armeabi-v7a/libnative_library.so \
            build/apk/lib/armeabi-v7a/

          cp \
            runtime/jni/libs/x86/libnative_library.so \
            build/apk/lib/x86/

          cp \
            runtime/jni/libs/x86_64/libnative_library.so \
            build/apk/lib/x86_64/

          echo "Runtime injected."

      - name: Build APK
        run: |
          set -euo pipefail

          cd build/apk

          zip -qr ../runtime-test-unaligned.apk .

          cd ../..

          unzip -t build/runtime-test-unaligned.apk >/dev/null

          echo "APK rebuilt successfully."

      - name: Zipalign APK
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            build/runtime-test-unaligned.apk \
            build/runtime-test.apk

          echo "Aligned APK:"
          ls -lh build/runtime-test.apk

      - name: Verify Runtime APK
        run: |
          set -euo pipefail

          APK="build/runtime-test.apk"

          unzip -t "$APK" >/dev/null

          echo "========================================"
          echo "DEX"
          echo "========================================"

          unzip -Z1 "$APK" \
            | grep -E '^classes([0-9]*)?\.dex$'

          echo
          echo "========================================"
          echo "Native libraries"
          echo "========================================"

          unzip -Z1 "$APK" \
            | grep '^lib/.*/.*\.so$'

          echo
          echo "========================================"
          echo "Runtime classes"
          echo "========================================"

          unzip -p "$APK" classes3.dex \
            > build/classes3.dex

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/d8" \
            --version

          ls -lh build/classes3.dex

      - name: Upload Runtime Test APK
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-apk
          path: |
            build/runtime-test.apk
            build/classes3.dex
          if-no-files-found: error
