name: Test Dex2Cxx

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dex2cxx:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "29.0.14206865"
      BUILD_TOOLS: "35.0.0"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Install Android SDK + NDK
      # ============================================================
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "NDK:"
          echo "$ANDROID_HOME/ndk/${NDK_VERSION}"

          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"

      # ============================================================
      # 5. Verify NDK
      # ============================================================
      - name: Verify NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_DIR="$ANDROID_HOME/ndk/${NDK_VERSION}"

          test -d "$NDK_DIR"

          echo "NDK directory:"
          ls -la "$NDK_DIR"

          echo
          echo "ndk-build:"
          ls -l "$NDK_DIR/ndk-build"

          chmod +x "$NDK_DIR/ndk-build"

          test -x "$NDK_DIR/ndk-build"

          echo
          echo "NDK build executable: OK"

      # ============================================================
      # 6. Check Input APK
      # ============================================================
      - name: Check Input APK
        shell: bash
        run: |
          set -euo pipefail

          test -s input/app.apk

          echo "Input APK:"
          ls -lh input/app.apk

          unzip -t input/app.apk >/dev/null

          echo
          echo "APK DEX files:"

          unzip -Z1 input/app.apk \
            | grep -E '^classes([0-9]*)?\.dex$' \
            | sort -V \
            || true

          echo
          echo "APK is valid."

      # ============================================================
      # 7. Clone Dex2Cxx
      # ============================================================
      - name: Clone Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dex2cxx_tool

          git clone \
            --depth 1 \
            https://github.com/ispointer/Dex2cxx.git \
            dex2cxx_tool

          cd dex2cxx_tool

          echo "Dex2Cxx commit:"
          git rev-parse HEAD

          echo
          echo "Repository files:"

          find . \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100

      # ============================================================
      # 8. Configure Dex2Cxx
      # ============================================================
      - name: Configure Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          NDK_DIR="$ANDROID_HOME/ndk/${NDK_VERSION}"

          test -d "$NDK_DIR"

          cat > dxx.cfg <<EOF
          {
              "apktool": "tools/apktool.jar",
              "ndk_dir": "$NDK_DIR",
              "signature": {
                  "keystore_path": "keystore/debug.keystore",
                  "alias": "androiddebugkey",
                  "keystore_pass": "android",
                  "store_pass": "android",
                  "v1_enabled": true,
                  "v2_enabled": true,
                  "v3_enabled": true
              },
              "ollvm": {
                  "enable": false,
                  "flags": "-fvisibility=hidden"
              }
          }
          EOF

          echo "========================================"
          echo "Dex2Cxx configuration"
          echo "========================================"

          cat dxx.cfg

      # ============================================================
      # 9. Prepare Filter
      # ============================================================
      - name: Prepare Filter
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          if [ -s ../filter.txt ]; then
            cp ../filter.txt ./filter.txt
          else
            cat > filter.txt <<'EOF'
          com.test1.MainActivity
          EOF
          fi

          echo "========================================"
          echo "Filter"
          echo "========================================"

          cat filter.txt

      # ============================================================
      # 10. Build Dex2Cxx JAR
      # ============================================================
      - name: Build Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          chmod +x java/build.sh

          ./java/build.sh

          test -s dex2cxx.jar

          echo
          echo "Dex2Cxx JAR:"
          ls -lh dex2cxx.jar

      # ============================================================
      # 11. Verify Dex2Cxx CLI
      # ============================================================
      - name: Verify Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          java -jar dex2cxx.jar --help

      # ============================================================
      # 12. Scan APK
      # ============================================================
      - name: Scan APK
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          rm -f methods-report.txt

          java -jar dex2cxx.jar \
            -a "../input/app.apk" \
            --filter ./filter.txt \
            --report ./methods-report.txt \
            --list-only

          echo
          echo "========================================"
          echo "MATCHED METHODS"
          echo "========================================"

          if [ -f methods-report.txt ]; then
            cat methods-report.txt
          fi

          MATCHED=$(wc -l < methods-report.txt 2>/dev/null || echo 0)

          echo
          echo "Matched methods: $MATCHED"

          if [ "$MATCHED" -eq 0 ]; then
            echo "::error::No methods matched filter.txt"
            exit 1
          fi

      # ============================================================
      # 13. Force Correct NDK Permissions
      # ============================================================
      - name: Prepare NDK For Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          NDK_DIR="$ANDROID_HOME/ndk/${NDK_VERSION}"

          echo "Using NDK:"
          echo "$NDK_DIR"

          chmod +x \
            "$NDK_DIR/ndk-build"

          chmod +x \
            "$NDK_DIR/build/ndk-build"

          find "$NDK_DIR/build" \
            -type f \
            -name "ndk-build" \
            -exec chmod +x {} \;

          test -x "$NDK_DIR/ndk-build"

          echo
          echo "NDK executables:"
          ls -l "$NDK_DIR/ndk-build"
          ls -l "$NDK_DIR/build/ndk-build"

      # ============================================================
      # 14. Run Dex2Cxx
      # ============================================================
      - name: Run Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          rm -f protected.apk

          echo "========================================"
          echo "Running Dex2Cxx"
          echo "========================================"

          echo "NDK:"
          echo "$ANDROID_HOME/ndk/${NDK_VERSION}"

          echo
          echo "Configuration:"
          cat dxx.cfg

          echo
          echo "Starting conversion..."

          java -jar dex2cxx.jar \
            -a "../input/app.apk" \
            -o protected.apk \
            --filter ./filter.txt \
            --report ./methods-report.txt

          test -s protected.apk

          echo
          echo "========================================"
          echo "PROTECTED APK"
          echo "========================================"

          ls -lh protected.apk

          unzip -t protected.apk >/dev/null

          echo
          echo "APK ZIP: OK"

      # ============================================================
      # 15. Analyze Output
      # ============================================================
      - name: Analyze Output
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          echo "========================================"
          echo "DEX FILES"
          echo "========================================"

          unzip -Z1 protected.apk \
            | grep -E '^classes([0-9]*)?\.dex$' \
            | sort -V \
            || true

          echo
          echo "========================================"
          echo "NATIVE LIBRARIES"
          echo "========================================"

          unzip -Z1 protected.apk \
            | grep '^lib/.*/.*\.so$' \
            || true

          echo
          echo "========================================"
          echo "METHOD REPORT"
          echo "========================================"

          cat methods-report.txt

      # ============================================================
      # 16. Upload Result
      # ============================================================
      - name: Upload Dex2Cxx Result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dex2cxx-test
          path: |
            dex2cxx_tool/protected.apk
            dex2cxx_tool/methods-report.txt
          if-no-files-found: error
