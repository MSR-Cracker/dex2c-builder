name: Test Dex2Cxx

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dex2cxx:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "29.0.14206865"
      BUILD_TOOLS: "35.0.0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"

          echo "Android SDK: $ANDROID_HOME"
          echo "NDK: $ANDROID_HOME/ndk/${NDK_VERSION}"

      - name: Check Input APK
        shell: bash
        run: |
          set -euo pipefail

          test -s input/app.apk

          echo "Input APK:"
          ls -lh input/app.apk

          unzip -t input/app.apk >/dev/null

          echo
          echo "DEX files in original APK:"

          unzip -Z1 input/app.apk \
            | grep -E '^classes([0-9]*)?\.dex$' \
            | sort -V \
            || true

      - name: Clone Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dex2cxx_tool

          git clone \
            --depth 1 \
            https://github.com/ispointer/Dex2cxx.git \
            dex2cxx_tool

          cd dex2cxx_tool

          echo "Dex2Cxx commit:"
          git rev-parse HEAD

      # ============================================================
      # IMPORTANT:
      # Dex2Cxx looks for its own android-ndk directory.
      # Put a local copy there so it doesn't download r30-beta2.
      # ============================================================
      - name: Prepare Dex2Cxx Local NDK
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          TARGET_NDK="$GITHUB_WORKSPACE/dex2cxx_tool/android-ndk"

          test -d "$SOURCE_NDK"

          rm -rf "$TARGET_NDK"

          echo "Copying Android NDK..."
          echo "FROM: $SOURCE_NDK"
          echo "TO:   $TARGET_NDK"

          cp -a "$SOURCE_NDK" "$TARGET_NDK"

          echo
          echo "Local NDK created."

          test -d "$TARGET_NDK"

          # Do NOT chmod the SDK filesystem.
          # We only modify the workspace copy.
          chmod +x "$TARGET_NDK/ndk-build" || true
          chmod +x "$TARGET_NDK/build/ndk-build" || true

          find "$TARGET_NDK/build" \
            -type f \
            -name "ndk-build" \
            -exec chmod +x {} \; \
            || true

          echo
          echo "Local ndk-build:"
          ls -l "$TARGET_NDK/ndk-build"

          test -x "$TARGET_NDK/ndk-build"

      - name: Configure Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          cat > dxx.cfg <<'EOF'
          {
              "apktool": "tools/apktool.jar",
              "ndk_dir": "android-ndk",
              "signature": {
                  "keystore_path": "keystore/debug.keystore",
                  "alias": "androiddebugkey",
                  "keystore_pass": "android",
                  "store_pass": "android",
                  "v1_enabled": true,
                  "v2_enabled": true,
                  "v3_enabled": true
              },
              "ollvm": {
                  "enable": false,
                  "flags": "-fvisibility=hidden"
              }
          }
          EOF

          echo "========================================"
          echo "dxx.cfg"
          echo "========================================"

          cat dxx.cfg

      - name: Prepare Filter
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          if [ -s ../filter.txt ]; then
            cp ../filter.txt ./filter.txt
          else
            cat > filter.txt <<'EOF'
          com.test1.MainActivity
          EOF
          fi

          echo "========================================"
          echo "filter.txt"
          echo "========================================"

          cat filter.txt

      - name: Build Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          chmod +x java/build.sh

          ./java/build.sh

          test -s dex2cxx.jar

          echo
          echo "Dex2Cxx JAR:"
          ls -lh dex2cxx.jar

      - name: Verify Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          java -jar dex2cxx.jar --help

      - name: Verify Local NDK Used By Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          echo "========================================"
          echo "LOCAL DEX2CXX NDK"
          echo "========================================"

          pwd

          echo
          echo "NDK path:"
          realpath android-ndk

          echo
          echo "NDK version:"
          cat android-ndk/source.properties

          echo
          echo "ndk-build:"
          ls -l android-ndk/ndk-build

          test -x android-ndk/ndk-build

          echo
          echo "Running ndk-build --version..."

          android-ndk/ndk-build --version || true

      - name: Scan APK
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          rm -f methods-report.txt

          java -jar dex2cxx.jar \
            -a "../input/app.apk" \
            --filter ./filter.txt \
            --report ./methods-report.txt \
            --list-only

          echo
          echo "========================================"
          echo "MATCHED METHODS"
          echo "========================================"

          cat methods-report.txt

          MATCHED=$(wc -l < methods-report.txt)

          echo
          echo "Matched methods: $MATCHED"

          if [ "$MATCHED" -eq 0 ]; then
            echo "::error::No methods matched filter.txt"
            exit 1
          fi

      - name: Run Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          rm -f protected.apk

          echo "========================================"
          echo "RUNNING DEX2CXX"
          echo "========================================"

          echo "Working directory:"
          pwd

          echo
          echo "Expected local NDK:"
          realpath android-ndk

          echo
          echo "Starting conversion..."

          java -jar dex2cxx.jar \
            -a "../input/app.apk" \
            -o protected.apk \
            --filter ./filter.txt \
            --report ./methods-report.txt

          test -s protected.apk

          echo
          echo "Dex2Cxx completed successfully."

          ls -lh protected.apk

      - name: Analyze Output
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          echo "========================================"
          echo "OUTPUT DEX"
          echo "========================================"

          unzip -Z1 protected.apk \
            | grep -E '^classes([0-9]*)?\.dex$' \
            | sort -V \
            || true

          echo
          echo "========================================"
          echo "OUTPUT NATIVE LIBRARIES"
          echo "========================================"

          unzip -Z1 protected.apk \
            | grep '^lib/.*/.*\.so$' \
            || true

          echo
          echo "========================================"
          echo "METHOD REPORT"
          echo "========================================"

          cat methods-report.txt

          echo
          echo "========================================"
          echo "APK TEST"
          echo "========================================"

          unzip -t protected.apk >/dev/null

          echo "APK ZIP: OK"

      - name: Upload Dex2Cxx Result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dex2cxx-test
          path: |
            dex2cxx_tool/protected.apk
            dex2cxx_tool/methods-report.txt
          if-no-files-found: error
