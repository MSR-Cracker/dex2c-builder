name: Test Dex2Cxx

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dex2cxx:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "29.0.14206865"
      BUILD_TOOLS: "35.0.0"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Install Android SDK + NDK
      # ============================================================
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          NDK_DIR="$ANDROID_HOME/ndk/${NDK_VERSION}"

          test -d "$NDK_DIR"
          test -x "$NDK_DIR/ndk-build"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_DIR=$NDK_DIR"

      # ============================================================
      # 5. Check Input APK
      # ============================================================
      - name: Check Input APK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s input/app.apk ]; then
            echo "::error::input/app.apk was not found."
            exit 1
          fi

          echo "Input APK:"
          ls -lh input/app.apk

          unzip -t input/app.apk >/dev/null

          echo
          echo "DEX files in original APK:"

          unzip -Z1 input/app.apk \
            | grep -E '^classes([0-9]*)?\.dex$' \
            | sort -V \
            || true

      # ============================================================
      # 6. Clone Dex2Cxx
      # ============================================================
      - name: Clone Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dex2cxx_tool

          git clone \
            --depth 1 \
            https://github.com/ispointer/Dex2cxx.git \
            dex2cxx_tool

          cd dex2cxx_tool

          echo "Dex2Cxx commit:"
          git rev-parse HEAD

      # ============================================================
      # 7. Configure Dex2Cxx
      # ============================================================
      - name: Configure Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          NDK_DIR="$ANDROID_HOME/ndk/${NDK_VERSION}"

          test -d "$NDK_DIR"
          test -x "$NDK_DIR/ndk-build"

          cat > dxx.cfg <<EOF
          {
              "apktool": "tools/apktool.jar",
              "ndk_dir": "$NDK_DIR",
              "signature": {
                  "keystore_path": "keystore/debug.keystore",
                  "alias": "androiddebugkey",
                  "keystore_pass": "android",
                  "store_pass": "android",
                  "v1_enabled": true,
                  "v2_enabled": true,
                  "v3_enabled": true
              },
              "ollvm": {
                  "enable": false,
                  "flags": "-fvisibility=hidden"
              }
          }
          EOF

          echo "========================================"
          echo "Dex2Cxx configuration"
          echo "========================================"

          cat dxx.cfg

          echo
          echo "NDK:"
          echo "$NDK_DIR"

          echo
          echo "ndk-build:"
          ls -l "$NDK_DIR/ndk-build"

          echo
          echo "Testing ndk-build..."

          "$NDK_DIR/ndk-build" --version || true

      # ============================================================
      # 8. Prepare Filter
      # ============================================================
      - name: Prepare Filter
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          if [ -s ../filter.txt ]; then
            cp ../filter.txt ./filter.txt
          else
            cat > filter.txt <<'EOF'
          com.test1.MainActivity
          EOF
          fi

          echo "========================================"
          echo "Filter"
          echo "========================================"

          cat filter.txt

      # ============================================================
      # 9. Build Dex2Cxx JAR
      # ============================================================
      - name: Build Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          chmod +x java/build.sh

          ./java/build.sh

          if [ ! -s dex2cxx.jar ]; then
            echo "::error::dex2cxx.jar was not generated."
            exit 1
          fi

          echo
          echo "Dex2Cxx JAR:"
          ls -lh dex2cxx.jar

      # ============================================================
      # 10. Verify CLI
      # ============================================================
      - name: Verify Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          java -jar dex2cxx.jar --help

      # ============================================================
      # 11. Scan APK
      # ============================================================
      - name: Scan APK
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          rm -f methods-report.txt

          java -jar dex2cxx.jar \
            -a "../input/app.apk" \
            --filter ./filter.txt \
            --report ./methods-report.txt \
            --list-only

          echo
          echo "========================================"
          echo "MATCHED METHODS"
          echo "========================================"

          if [ -f methods-report.txt ]; then
            cat methods-report.txt
          fi

          MATCHED=$(wc -l < methods-report.txt 2>/dev/null || echo 0)

          echo
          echo "Matched methods: $MATCHED"

          if [ "$MATCHED" -eq 0 ]; then
            echo "::error::No methods matched filter.txt"
            exit 1
          fi

      # ============================================================
      # 12. Verify NDK Path Before Conversion
      # ============================================================
      - name: Verify Dex2Cxx NDK Path
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          NDK_DIR="$ANDROID_HOME/ndk/${NDK_VERSION}"

          echo "========================================"
          echo "FINAL NDK CHECK"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo
          echo "Configured NDK:"
          grep '"ndk_dir"' dxx.cfg

          echo
          echo "Absolute NDK path:"
          realpath "$NDK_DIR"

          echo
          echo "ndk-build:"
          ls -l "$NDK_DIR/ndk-build"

          test -x "$NDK_DIR/ndk-build"

          echo
          echo "NDK check: OK"

      # ============================================================
      # 13. Run Dex2Cxx
      # ============================================================
      - name: Run Dex2Cxx
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          rm -f protected.apk

          echo "========================================"
          echo "RUNNING DEX2CXX"
          echo "========================================"

          echo "Working directory:"
          pwd

          echo
          echo "Dex2Cxx configuration:"
          cat dxx.cfg

          echo
          echo "Starting conversion..."

          java -jar dex2cxx.jar \
            -a "../input/app.apk" \
            -o protected.apk \
            --filter ./filter.txt \
            --report ./methods-report.txt

          if [ ! -s protected.apk ]; then
            echo "::error::Dex2Cxx did not generate protected.apk."
            exit 1
          fi

          echo
          echo "========================================"
          echo "DEX2CXX COMPLETED"
          echo "========================================"

          ls -lh protected.apk

      # ============================================================
      # 14. Validate Protected APK
      # ============================================================
      - name: Validate Protected APK
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          test -s protected.apk

          unzip -t protected.apk >/dev/null

          echo "APK ZIP structure: OK"

      # ============================================================
      # 15. Analyze Output
      # ============================================================
      - name: Analyze Output
        shell: bash
        run: |
          set -euo pipefail

          cd dex2cxx_tool

          echo
          echo "========================================"
          echo "OUTPUT DEX FILES"
          echo "========================================"

          unzip -Z1 protected.apk \
            | grep -E '^classes([0-9]*)?\.dex$' \
            | sort -V \
            || true

          echo
          echo "========================================"
          echo "OUTPUT NATIVE LIBRARIES"
          echo "========================================"

          unzip -Z1 protected.apk \
            | grep '^lib/.*/.*\.so$' \
            || true

          echo
          echo "========================================"
          echo "METHOD REPORT"
          echo "========================================"

          cat methods-report.txt

      # ============================================================
      # 16. Upload Result
      # ============================================================
      - name: Upload Dex2Cxx Result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dex2cxx-test
          path: |
            dex2cxx_tool/protected.apk
            dex2cxx_tool/methods-report.txt
          if-no-files-found: error
